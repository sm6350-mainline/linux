%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/awinic,aw88264.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Awinic AW88264 Smart Audio Amplifier

maintainers:
  - Tim auf der Landwehr <tadl-git@taufderl.de>

description: >
  The Awinic AW88264 is an I2S input smart speaker amplifier.

  It is a separate binding from awinic,aw88395.yaml rather than another entry
  in that file's compatible list, because it is a separate generation of the
  part: it reports chip id 0x1852 where every device covered there reports
  0x2049 or above, and its register map diverges accordingly. It also has
  none of that family's firmware-container properties, because the driver
  loads no container.

properties:
  compatible:
    const: awinic,aw88264

  reg:
    maxItems: 1

  '#sound-dai-cells':
    const: 0

  reset-gpios:
    maxItems: 1

required:
  - compatible
  - reg
  - '#sound-dai-cells'

allOf:
  - $ref: dai-common.yaml#

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        audio-codec@34 {
            compatible = "awinic,aw88264";
            reg = <0x34>;
            #sound-dai-cells = <0>;
            reset-gpios = <&gpio 12 GPIO_ACTIVE_HIGH>;
        };
    };
